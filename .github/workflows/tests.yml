name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m pure_agent_cyber --demo
      - run: python -m gnostic_axioms --demo
      - run: python eval/run_eval.py main
      - run: python eval/run_eval.py heldout
      - run: python eval/run_eval.py heldout2
